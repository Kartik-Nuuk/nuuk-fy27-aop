<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Nuuk · FY27 AOP</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&family=DM+Serif+Display&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

<style>
:root{
  --bg:#FAFAFA; --surface:#FFFFFF; --surface2:#F3F4F6; --surface3:#E5E7EB;
  --border:#E5E7EB; --border-lt:#D1D5DB;
  --text:#111827; --muted:#6B7280; --dim:#9CA3AF;
  --accent:#0B5563; --accent2:#0E7490;
  --base:#1E40AF; --opt:#059669; --stretch:#7C3AED;
  --gold:#D97706; --live:#7C3AED; --npd:#EA580C;
  --pos:#059669; --neg:#DC2626;
  --hl-rev:#DBEAFE; --hl-rev-fg:#1E3A8A;
  --hl-gm: #FED7AA; --hl-gm-fg:#9A3412;
  --hl-tcs:#FBCFE8; --hl-tcs-fg:#9F1239;
  --hl-cm2:#DDD6FE; --hl-cm2-fg:#5B21B6;
  --hl-eb: #FEF3C7; --hl-eb-fg:#92400E;
}
*{box-sizing:border-box}
body{margin:0;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);font-size:13px}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:12px 28px;background:var(--surface);border-bottom:1px solid var(--border)}
.logo{font-family:'DM Serif Display',serif;font-size:22px}.logo span{color:var(--accent)}
.fy-badge{padding:4px 10px;background:var(--accent);color:white;border-radius:6px;font-size:11px;font-weight:600}
.chip{padding:3px 10px;background:var(--surface2);color:var(--muted);border-radius:99px;font-size:11px;font-family:'DM Mono',monospace}
.tab-bar{display:flex;background:var(--surface);border-bottom:1px solid var(--border);padding:0 28px;gap:2px;overflow-x:auto;position:sticky;top:0;z-index:50}
.tab-btn{padding:12px 18px;font-family:inherit;font-size:12px;font-weight:500;color:var(--muted);background:none;border:none;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab-btn:hover{color:var(--text)}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab-content{display:none;padding:20px 24px}
.tab-content.active{display:block}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:18px;margin-bottom:16px}
.card-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:10px}
.muted{color:var(--muted)} .small{font-size:11px} .mono{font-family:'DM Mono',monospace}
.pos{color:var(--pos)} .neg{color:var(--neg)}
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:var(--surface2);padding:8px 10px;text-align:center;font-weight:600;border-bottom:1px solid var(--border);font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);white-space:nowrap}
td{padding:6px 10px;border-bottom:1px solid var(--border);font-family:'DM Mono',monospace;text-align:center;white-space:nowrap}
td.lh{text-align:left;font-family:'DM Sans',sans-serif}
th.left{text-align:left}
tr:hover td{background:var(--surface2)}
tr.group-row td{background:var(--surface2);cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--text)}
tr.group-row td:first-child::before{content:'▼ ';color:var(--muted);font-size:9px}
tr.group-row.collapsed td:first-child::before{content:'▶ ';color:var(--muted);font-size:9px}
tr.total-row td{font-weight:600;background:var(--surface2)}
.cell-val{font-size:12px}
.cell-gr{font-size:9px;font-family:'DM Mono',monospace;margin-top:1px;display:block;color:var(--dim)}
.cell-gr.pos{color:var(--pos)} .cell-gr.neg{color:var(--neg)}
.dim{color:var(--dim)}
.badge{font-size:9px;background:var(--surface2);padding:2px 6px;border-radius:3px;margin-left:4px;font-family:'DM Sans',sans-serif;text-transform:uppercase;letter-spacing:.04em;display:inline-block;color:var(--dim)}
.badge-hero{background:rgba(217,119,6,.15);color:var(--gold)}
.badge-emerging{background:rgba(124,58,237,.15);color:var(--live)}
.badge-npd{background:rgba(234,88,12,.15);color:var(--npd)}
.badge-live{background:rgba(5,150,105,.12);color:var(--pos)}
.badge-seasonal{background:rgba(30,64,175,.12);color:var(--base)}
.badge-ever{background:rgba(5,150,105,.10);color:var(--pos)}
.seg-toggle{display:inline-flex;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:2px;gap:2px;vertical-align:middle}
.seg-toggle button{padding:5px 11px;font-size:11px;font-family:inherit;font-weight:500;color:var(--muted);background:none;border:none;border-radius:4px;cursor:pointer}
.seg-toggle button.active{background:var(--accent);color:#fff}
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:8px 0 14px;border-bottom:1px solid var(--border);margin-bottom:14px}
.toolbar-group{display:flex;gap:6px;align-items:center}
.toolbar-label{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.toolbar-divider{width:1px;height:18px;background:var(--border)}
.btn-sm{padding:5px 10px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;font-size:11px;cursor:pointer;font-family:inherit;color:var(--muted)}
.btn-sm:hover{color:var(--text)}
.filter-actions{display:flex;gap:8px;padding:4px 0 8px 0}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:14px 0}
.kpi-tile{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px}
.kpi-label{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.kpi-val{font-size:22px;font-weight:700;margin-top:4px;font-family:'DM Serif Display',serif}
.kpi-sub{font-size:11px;color:var(--muted);margin-top:2px;font-family:'DM Mono',monospace}
.scenario-pill{display:inline-block;padding:5px 14px;border-radius:99px;font-size:11px;font-weight:600;cursor:pointer;background:var(--surface2);color:var(--muted);border:1px solid var(--border)}
.scenario-pill.active.base{background:#DBEAFE;color:var(--base);border-color:#BFDBFE}
.scenario-pill.active.opt{background:#D1FAE5;color:var(--opt);border-color:#A7F3D0}
.tbl-wrap{overflow:auto;max-height:680px;border:1px solid var(--border);border-radius:8px}
.tbl-wrap table th{position:sticky;top:0;z-index:3}
.frozen-col{position:sticky;left:0;background:var(--surface);z-index:1}
.frozen-col-h{position:sticky;left:0;background:var(--surface2);z-index:4;text-align:left !important}
.chart-wrap{position:relative;height:320px}
.chart-row{display:grid;grid-template-columns:1.1fr 1fr;gap:14px;align-items:stretch}
.donut-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.donut-card{display:flex;gap:6px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px;min-width:0;overflow:hidden}
.donut-c{flex:0 0 110px;height:110px;position:relative}
.donut-side{flex:1;min-width:0;font-size:10px;display:flex;flex-direction:column;gap:2px;max-height:130px;overflow-y:auto}
.donut-side .item{display:flex;justify-content:space-between;gap:4px;padding:2px 0;border-bottom:1px dashed var(--border);cursor:pointer}
.donut-side .item:hover{background:var(--surface2)}
.donut-side .item:last-child{border-bottom:none}
.donut-side .item .lbl{display:flex;gap:4px;align-items:center;min-width:0}
.donut-side .item .swatch{width:9px;height:9px;border-radius:2px;flex:0 0 9px}
.donut-side .item .pct{font-family:'DM Mono',monospace;color:var(--muted);flex-shrink:0;font-size:10px}
.donut-side .item .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat-icon{font-size:13px}
input[type="checkbox"]{accent-color:var(--accent)}
input[type="number"]{width:64px;padding:4px 8px;font-family:'DM Mono',monospace;border:1px solid var(--border);border-radius:6px;text-align:right}
tr.hl-rev td{background:var(--hl-rev) !important;color:var(--hl-rev-fg);font-weight:700}
tr.hl-gm  td{background:var(--hl-gm)  !important;color:var(--hl-gm-fg); font-weight:700}
tr.hl-tcs td{background:var(--hl-tcs) !important;color:var(--hl-tcs-fg);font-weight:700}
tr.hl-cm2 td{background:var(--hl-cm2) !important;color:var(--hl-cm2-fg);font-weight:700}
tr.hl-eb  td{background:var(--hl-eb)  !important;color:var(--hl-eb-fg); font-weight:700}
tr.indent td.lh{padding-left:30px;color:var(--muted);font-style:italic;font-size:11px}
tr.subtotal td{background:#F9FAFB;font-weight:600}
.col-divider{border-left:1px solid var(--border-lt) !important}
</style>
</head>

  return `<span class="cell-gr ${cls}">${sign}${(v*100).toFixed(d)}%</span>`;
};

/* -------- Scenario adjustments -------- */
function scArr(channel, skuName, metric, scenario){
  const row = DATA.aop[channel] && DATA.aop[channel][skuName];
  if (!row) return new Array(12).fill(0);
  let arr = (row[metric] || new Array(12).fill(0)).slice();
  const sc = SCENARIOS[scenario];
  if (!sc) return arr;
  const cut = sc.haircut/100;
  if (metric==='revenue' || metric==='units' || metric==='tacos_spend'){
    arr = scaleArr(arr, 1-cut);
  }
  return arr;
}
const skuRev = (n,sc)=> scArr('Overall',n,'revenue',sc);
const skuUnits = (n,sc)=> scArr('Overall',n,'units',sc);

/* TACOS scaling — overall perf-mkt% matches investor scenario */
const _factorCache = {};
function scenarioTacosFactor(sc){
  if (_factorCache[sc] != null) return _factorCache[sc];
  const tr = sum(DATA.skus.map(s=>sum(skuRev(s.name,sc))));
  const ts = sum(DATA.skus.map(s=>sum(scArr('Overall', s.name, 'tacos_spend', sc))));
  const cur = tr>0 ? ts/tr : 0;
  const tgt = INV[SCENARIOS[sc].invKey].perf_mkt_pct;
  return _factorCache[sc] = cur>0 ? tgt/cur : 1;
}
const skuSpend = (n,sc)=> scaleArr(scArr('Overall',n,'tacos_spend',sc), scenarioTacosFactor(sc));
function chSpend(ch, sku, sc){ return scaleArr(scArr(ch, sku, 'tacos_spend', sc), scenarioTacosFactor(sc)); }

function computeMetricByPeriod(skus, sc, metric, view, year){
  const rev = new Array(12).fill(0), un = new Array(12).fill(0), sp = new Array(12).fill(0);
  if (year==='fy27'){
    skus.forEach(s=>{
      addArrInPlace(rev, skuRev(s.name, sc));
      addArrInPlace(un,  skuUnits(s.name, sc));
      addArrInPlace(sp,  skuSpend(s.name, sc));
    });
  } else {
    skus.forEach(s=>{
      for (const ch of Object.keys(DATA.hist)){
        const d = DATA.hist[ch][s.name];
        if (!d) continue;
        for (let i=0;i<12;i++){
          rev[i] += (d[year+'_rev'][i]||0)/CR;
          un[i]  += (d[year+'_units'][i]||0);
          sp[i]  += (d[year+'_spend'][i]||0)/CR;
        }
      }
    });
  }
  if (metric==='rev')   return bucket(rev, view);
  if (metric==='units') return bucket(un, view);
  const spB = bucket(sp, view), rvB = bucket(rev, view);
  return spB.map((s,i)=> rvB[i]>0 ? s/rvB[i] : 0);
}

function bucketPctFromAbs(numerArr12, denomArr12, view){
  if (!numerArr12 || !denomArr12) return null;
  const numB = bucketArr(numerArr12, view);
  const denB = bucketArr(denomArr12, view);
  return numB.map((n,i)=> denB[i]>0 ? n/denB[i] : null);
}
function bucketConstPct(pct, view){
  if (view==='Monthly') return new Array(12).fill(pct);
  if (view==='Quarterly') return new Array(4).fill(pct);
  return [pct];
}

function fmtChangeInline(curVal, prevVal, type){
  if (curVal==null||prevVal==null||isNaN(curVal)||isNaN(prevVal)) return '';
  if (type==='pct'){
    const bps = (curVal - prevVal)*10000;
    if (Math.abs(bps) < 0.5) return '';
    const cls = bps>=0 ? 'pos' : 'neg';
    const sign = bps>=0 ? '+' : '';
    return `<div style="font-size:9px;font-family:'DM Mono'" class="${cls}">${sign}${Math.round(bps)} bps</div>`;
  } else {
    if (Math.abs(prevVal) < 0.001) return '';
    const pct = (curVal - prevVal) / Math.abs(prevVal);
    if (!isFinite(pct)) return '';
    const cls = pct>=0 ? 'pos' : 'neg';
    const sign = pct>=0 ? '+' : '';
    return `<div style="font-size:9px;font-family:'DM Mono'" class="${cls}">${sign}${(pct*100).toFixed(0)}%</div>`;
  }
}

        const fy26V = it.pcts.fy26Num ? bucketPctFromAbs(it.pcts.fy26Num, it.pcts.fy26Den, view) : null;
        const bV = it.pcts.b!=null ? bucketConstPct(it.pcts.b, view) : null;
        const oV = it.pcts.o!=null ? bucketConstPct(it.pcts.o, view) : null;
        const clr = {fy25:'#9CA3AF',fy26:'#9CA3AF',b:'#93C5FD',o:'#6EE7B7'};
        periods.forEach((p,pi)=>{
          colKeys.forEach((k,ki)=>{
            const vals = k==='fy25'?fy25V:k==='fy26'?fy26V:k==='b'?bV:oV;
            const v = vals ? vals[pi] : null;
            const border = (ki===0&&pi>0) ? 'border-left:1px solid #374151;' : '';
            html += `<td style="text-align:center;${border}font-size:11px;color:${clr[k]}">${v!=null?(v*100).toFixed(1)+'%':'—'}</td>`;
          });
        });
      } else {
        html += `<td colspan="${periods.length*colKeys.length}"></td>`;
      }
      html += `</tr>`;
      return;
    }
    if (it.collapsible){
      const open = state.ot_overheads_open;
      html += `<tr class="${it.cls||''}" style="cursor:pointer" onclick="state.ot_overheads_open=!state.ot_overheads_open;rerender()">
        <td class="frozen-col lh">${open?'▼':'▶'} ${it.label}</td>
        ${rowCells(it, periods, colKeys, view)}</tr>`;
      return;
    }
    if (it.sub === 'overheads' && !state.ot_overheads_open) return;
    const indent = it.sub ? 'indent' : '';
    html += `<tr class="${it.cls||''} ${indent}">
      <td class="frozen-col lh">${it.label}</td>
      ${rowCells(it, periods, colKeys, view)}</tr>`;
  });
  html += '</tbody></table></div>';
  return html;
}

function rowCells(it, periods, colKeys, view){
  // Compute values for fy25, fy26, b, o per period
  let fy25Vals, fy26Vals, bVals, oVals;
  if (it.type==='pct'){
    fy25Vals = it.fy25NumM ? bucketPctFromAbs(it.fy25NumM, it.fy25DenM, view) : null;
    fy26Vals = it.fy26NumM ? bucketPctFromAbs(it.fy26NumM, it.fy26DenM, view) : null;
    bVals = it.fy27NumM_b ? bucketPctFromAbs(it.fy27NumM_b, it.fy27DenM_b, view)
            : it.fy27ConstPct ? bucketConstPct(it.bM[0], view) : bucketArr(it.bM, view);
    oVals = it.fy27NumM_o ? bucketPctFromAbs(it.fy27NumM_o, it.fy27DenM_o, view)
            : it.fy27ConstPct ? bucketConstPct(it.oM[0], view) : bucketArr(it.oM, view);
  } else {
    fy25Vals = bucketArr(it.fy25M, view);
    fy26Vals = bucketArr(it.fy26M, view);
    bVals = bucketArr(it.bM, view);
    oVals = bucketArr(it.oM, view);
  }
  let cells = '';
  periods.forEach((p,pi)=>{
    colKeys.forEach((k,ki)=>{
      let v=null, prev=null;
      if (k==='fy25') v = fy25Vals?fy25Vals[pi]:null;
      else if (k==='fy26'){ v = fy26Vals?fy26Vals[pi]:null; prev = fy25Vals?fy25Vals[pi]:null; }
      else if (k==='b'){ v = bVals?bVals[pi]:null; prev = fy26Vals?fy26Vals[pi]:null; }
      else if (k==='o'){ v = oVals?oVals[pi]:null; prev = fy26Vals?fy26Vals[pi]:null; }
      let main = (v==null||isNaN(v)) ? '—' : (it.type==='pct' ? fmtPct(v,1) : fmtCr(v,1));
      const change = fmtChangeInline(v, prev, it.type);
      const cls = ki===0 && pi>0 ? 'col-divider' : '';
      cells += `<td class="${cls}" style="text-align:center">${main}${change}</td>`;
    });
  });
  return cells;
}

function donutHTML(title, id){
  return `<div><div class="small muted" style="margin-bottom:4px">${title}</div>
    <div class="donut-card"><div class="donut-c"><canvas id="${id}"></canvas></div><div class="donut-side" id="${id}-side"></div></div></div>`;
}
function donutTooltipFmt(metric, val){
  return metric==='units' ? Math.round(val).toLocaleString('en-IN') : '₹'+val.toFixed(1)+' Cr';
}
function drawDonut(id, labels, dataArr, palette, onClick){
  const ctx = document.getElementById(id).getContext('2d');
  if (window['_'+id]) window['_'+id].destroy();
  const total = dataArr.reduce((a,b)=>a+b,0);
  const metricUsed = state.prod_chart_metric || state.seg_chart_metric || state.ch_chart_metric || 'rev';
  window['_'+id] = new Chart(ctx, {
    type:'doughnut',
    data:{labels, datasets:[{data:dataArr, backgroundColor:palette.slice(0,labels.length), borderWidth:1, borderColor:'#FFF'}]},
    options:{maintainAspectRatio:false, cutout:'62%', plugins:{legend:{display:false}, datalabels:{display:false},
      tooltip:{callbacks:{label:c=>c.label+': '+donutTooltipFmt(metricUsed, c.parsed)}}},
      onClick:(e,el)=>{ if (el[0] && onClick) onClick(el[0].index); }}
  });
  const side = document.getElementById(id+'-side');
  if (!side) return;
  side.innerHTML = labels.map((l,i)=>{
    const v = dataArr[i] || 0;
    const pct = total>0 ? v/total*100 : 0;
    const ic = CAT_ICONS[l] || '';
    return `<div class="item" onclick="(${onClick||(()=>{})})(${i})"><div class="lbl"><span class="swatch" style="background:${palette[i]}"></span><span class="cat-icon">${ic}</span><span class="nm">${l}</span></div><div class="pct">${pct.toFixed(1)}%</div></div>`;
  }).join('');
}

function fmtMetric(v, metric){
  if (metric==='rev')   return `<span class="cell-val">${fmtRev(v)}</span>`;
  if (metric==='units') return `<span class="cell-val">${fmtInt(v)}</span>`;
  return `<span class="cell-val">${fmtPct(v)}</span>`;
}

function buildGroupedTable(skus, groupKey, sc, view, metric, histMode, collapsedMap, toggleFn){
  const labels = periodLabels(view);
  const histCols = histMode==='both' ? 3 : histMode==='fy26' ? 2 : 1;
  const yrCols   = histMode==='both' ? ['FY27','FY26','FY25'] : histMode==='fy26' ? ['FY27','FY26'] : ['FY27'];
  const groupBy = {};
  skus.forEach(s=>{ (groupBy[s[groupKey]] = groupBy[s[groupKey]]||[]).push(s); });
  const groupRev = {};
  Object.entries(groupBy).forEach(([g,arr])=>{
    groupRev[g] = sum(arr.reduce((a,s)=>addArr(a,skuRev(s.name,sc)), new Array(12).fill(0)));
  });
  const orderedGroups = Object.keys(groupBy).sort((a,b)=>groupRev[b]-groupRev[a]);
  let html = `<div class="card" style="padding:0;margin-top:0;border:none"><div style="overflow-x:auto"><table>
    <thead><tr>
      <th class="frozen-col-h" rowspan="2" style="min-width:240px">Product</th>
      <th rowspan="2">Type</th>`;
  labels.forEach(l=>html += `<th colspan="${histCols}" style="text-align:center" class="col-divider">${l}</th>`);
  html += `<th colspan="${histCols}" style="text-align:center" class="col-divider">FY Total</th></tr><tr>`;
  for (let p=0; p<labels.length+1; p++){
    yrCols.forEach((yr,j)=>{
      const cls = (j===0?'col-divider ':'') + (yr==='FY27'?'':'dim');
      html += `<th class="${cls}">${yr}</th>`;
    });
  }
  html += `</tr></thead><tbody>`;
  const renderValueCell = (v) => fmtMetric(v, metric);
  const renderGrowth = (c27, c26, i) => {
    const base = c26[i];
    if (metric==='tacos') return fmtDeltaBps(c27[i], base);
    return fmtDelta(base>0 ? (c27[i]-base)/base : null);
  };
  const renderTotalGrowth = (t27, t26) => {
    if (metric==='tacos') return fmtDeltaBps(t27, t26);
    return fmtDelta(t26>0 ? (t27-t26)/t26 : null);
  };
  orderedGroups.forEach(g=>{
    const arr = groupBy[g];
    const c27 = computeMetricByPeriod(arr, sc, metric, view, 'fy27');
    const c26 = computeMetricByPeriod(arr, sc, metric, view, 'fy26');
    const c25 = computeMetricByPeriod(arr, sc, metric, view, 'fy25');
    const t27 = computeMetricByPeriod(arr, sc, metric, 'Annual', 'fy27')[0];
    const t26 = computeMetricByPeriod(arr, sc, metric, 'Annual', 'fy26')[0];
    const t25 = computeMetricByPeriod(arr, sc, metric, 'Annual', 'fy25')[0];
    const collapsed = !!collapsedMap[g];
    const ic = CAT_ICONS[g] || '';
    html += `<tr class="group-row ${collapsed?'collapsed':''}" onclick="${toggleFn}('${g.replace(/'/g,"\\'")}')">
      <td class="frozen-col lh">${ic} ${g} <span class="chip">${arr.length} Products</span></td>
      <td class="lh"></td>`;
    for (let i=0;i<labels.length;i++){
      html += `<td class="col-divider">${renderValueCell(c27[i])}${renderGrowth(c27,c26,i)}</td>`;
      if (histCols>=2) html += `<td class="dim">${renderValueCell(c26[i])}</td>`;
      if (histCols>=3) html += `<td class="dim">${renderValueCell(c25[i])}</td>`;
    }
    html += `<td class="col-divider">${renderValueCell(t27)}${renderTotalGrowth(t27,t26)}</td>`;
    if (histCols>=2) html += `<td class="dim">${renderValueCell(t26)}</td>`;
    if (histCols>=3) html += `<td class="dim">${renderValueCell(t25)}</td>`;
    html += `</tr>`;
    if (!collapsed){
      arr.forEach(s=>{
        const sc27 = computeMetricByPeriod([s], sc, metric, view, 'fy27');
        const sc26 = computeMetricByPeriod([s], sc, metric, view, 'fy26');
        const sc25 = computeMetricByPeriod([s], sc, metric, view, 'fy25');
        const st27 = computeMetricByPeriod([s], sc, metric, 'Annual', 'fy27')[0];
        const st26 = computeMetricByPeriod([s], sc, metric, 'Annual', 'fy26')[0];
        const st25 = computeMetricByPeriod([s], sc, metric, 'Annual', 'fy25')[0];
        html += `<tr><td class="frozen-col lh" style="padding-left:32px">${s.product} ${stageBadge(s.launch_stage)}${heroBadge(s.hero)}</td>
          <td>${typeBadge(s.type)}</td>`;
        for (let i=0;i<labels.length;i++){
          html += `<td class="col-divider">${renderValueCell(sc27[i])}${renderGrowth(sc27,sc26,i)}</td>`;
          if (histCols>=2) html += `<td class="dim">${renderValueCell(sc26[i])}</td>`;
          if (histCols>=3) html += `<td class="dim">${renderValueCell(sc25[i])}</td>`;
        }
        html += `<td class="col-divider">${renderValueCell(st27)}${renderTotalGrowth(st27,st26)}</td>`;
        if (histCols>=2) html += `<td class="dim">${renderValueCell(st26)}</td>`;
        if (histCols>=3) html += `<td class="dim">${renderValueCell(st25)}</td>`;
        html += `</tr>`;
      });
    }
  });
  const gc27 = computeMetricByPeriod(skus, sc, metric, view, 'fy27');
  const gc26 = computeMetricByPeriod(skus, sc, metric, view, 'fy26');
  const gc25 = computeMetricByPeriod(skus, sc, metric, view, 'fy25');
  const gt27 = computeMetricByPeriod(skus, sc, metric, 'Annual', 'fy27')[0];
  const gt26 = computeMetricByPeriod(skus, sc, metric, 'Annual', 'fy26')[0];
  const gt25 = computeMetricByPeriod(skus, sc, metric, 'Annual', 'fy25')[0];
  html += `<tr class="total-row"><td class="frozen-col lh">Total</td><td class="lh"><span class="chip">${skus.length} Products</span></td>`;
  for (let i=0;i<labels.length;i++){
    html += `<td class="col-divider">${renderValueCell(gc27[i])}${renderGrowth(gc27,gc26,i)}</td>`;
    if (histCols>=2) html += `<td class="dim">${renderValueCell(gc26[i])}</td>`;
    if (histCols>=3) html += `<td class="dim">${renderValueCell(gc25[i])}</td>`;
  }
  html += `<td class="col-divider">${renderValueCell(gt27)}${renderTotalGrowth(gt27,gt26)}</td>`;
  if (histCols>=2) html += `<td class="dim">${renderValueCell(gt26)}</td>`;
  if (histCols>=3) html += `<td class="dim">${renderValueCell(gt25)}</td>`;
  html += `</tr></tbody></table></div></div>`;
  return html;
}

/* ============ TAB 3: SEGMENT VIEW ============ */
function segOf(s){
  const heroBucket = s.hero==='Hero' ? 'Hero' : (s.hero==='Emerging' ? 'Emerging' : 'Non-Hero');
  const seasonBucket = s.type==='Seasonal' ? 'Seasonal' : 'All-Season';
  return heroBucket+' · '+seasonBucket;
}
const SEG_PALETTE = {
  'Hero · All-Season':'#D97706', 'Hero · Seasonal':'#FBBF24',
  'Emerging · All-Season':'#7C3AED', 'Emerging · Seasonal':'#A78BFA',
  'Non-Hero · All-Season':'#9CA3AF', 'Non-Hero · Seasonal':'#6B7280',
};
function renderSegment(){
  const host = document.getElementById('tab-segment');
  const sc = state.scenario;
  const SEGS = ['Hero · All-Season','Hero · Seasonal','Emerging · All-Season','Emerging · Seasonal','Non-Hero · All-Season','Non-Hero · Seasonal'];
  let html = '<div class="card"><div class="card-title">Revenue contribution by Segment</div>'
    + '<div style="margin-bottom:10px;display:flex;gap:14px;align-items:center">' + scenarioPills()

    + donutHTML('FY27 '+SCENARIOS[sc].name,'segFY27')
    + '</div>'
    + '<div class="small muted" style="margin-top:8px">Click a segment to drill into product-level breakdown.</div>'
    + '<div id="segDrill" style="margin-top:14px"></div></div>';
  html += renderSegmentTable(sc);
  host.innerHTML = html;

  function dataForYear(yr){
    return SEGS.map(seg=>{
      const skus = DATA.skus.filter(s=>segOf(s)===seg);
      let t = 0;
      skus.forEach(s=>{
        if (yr==='fy27'){ t += state.seg_chart_metric==='rev' ? sum(skuRev(s.name, sc)) : sum(skuUnits(s.name, sc)); }
        else { Object.values(DATA.hist).forEach(ch=>{const d=ch[s.name]; if(!d) return; t += state.seg_chart_metric==='rev' ? sum(d[yr+'_rev'])/CR : sum(d[yr+'_units']);}); }
      });
      return t;
    });
  }
  const palette = SEGS.map(s=>SEG_PALETTE[s]);
  drawDonut('segFY25', SEGS, dataForYear('fy25'), palette, (i)=>showSegDrill(SEGS[i]));

/* Primary revenue: split each month's secondary revenue into (current month %) + (next month %) based on stock-fill days.
   For SKU × channel: stock_fill_days / 30 = fraction that came from THIS month (i.e. shifts demand back). Then aggregate.
   Then deduct marketplace commissions to get "net primary revenue to us". */
function wcPrimaryRevByMonth(sc){
  const ampB = WC_AMZ_B2B;
  const chMix = [
    {ch:'Amazon', days:WC_CHANNEL_DAYS['Amazon B2B'].fill, frac:ampB,  comm:INV[SCENARIOS[sc].invKey].commission_b2b},
    {ch:'Amazon', days:WC_CHANNEL_DAYS['Amazon B2C'].fill, frac:1-ampB, comm:INV[SCENARIOS[sc].invKey].commission_other},
    {ch:'Web',     days:0,  frac:1, comm:INV[SCENARIOS[sc].invKey].commission_other},
    {ch:'Blinkit', days:30, frac:1, comm:INV[SCENARIOS[sc].invKey].commission_other},
    {ch:'Flipkart',days:20, frac:1, comm:INV[SCENARIOS[sc].invKey].commission_other},
    {ch:'Swiggy',  days:30, frac:1, comm:INV[SCENARIOS[sc].invKey].commission_other},
    {ch:'Offline', days:15, frac:1, comm:INV[SCENARIOS[sc].invKey].commission_other},
    {ch:'Corporate',days:0, frac:1, comm:INV[SCENARIOS[sc].invKey].commission_other},
    {ch:'Others',  days:30, frac:1, comm:INV[SCENARIOS[sc].invKey].commission_other},
  ];
  // Scale secondary revenue to investor target first
  const totalSec = sum(DATA.skus.map(s=>sum(skuRev(s.name, sc)))) || 1;
  const scale = INV[SCENARIOS[sc].invKey].net_rev / totalSec;
  const grossPrimary = new Array(12).fill(0);
  const commission   = new Array(12).fill(0);
  DATA.skus.forEach(s=>{
    chMix.forEach(({ch,days,frac,comm})=>{
      const sec = scArr(ch, s.name, 'revenue', sc).map(v=>v*scale);
      // Primary timing shift: % current month + % next month
      const pNext = days/30;  // fraction sourced from next month's secondary
      const pCur  = 1 - pNext;
      for (let m=0;m<12;m++){
        const cur = sec[m] || 0;
        const nxt = m<11 ? sec[m+1] : sec[11];
        const primM = (pCur*cur + pNext*nxt) * frac;
        grossPrimary[m] += primM;
        commission[m]   += primM * comm;
      }
    });
  });
  return {grossPrimary, commission, netPrimary: grossPrimary.map((v,i)=>v-commission[i])};
}

function wcPrimaryUnitsByMonth(sc){
  const ampB = WC_AMZ_B2B;
  const chMix = [
    {ch:'Amazon', days:WC_CHANNEL_DAYS['Amazon B2B'].fill, frac:ampB},
    {ch:'Amazon', days:WC_CHANNEL_DAYS['Amazon B2C'].fill, frac:1-ampB},
    {ch:'Web', days:0, frac:1},{ch:'Blinkit', days:30, frac:1},
    {ch:'Flipkart', days:20, frac:1},{ch:'Swiggy', days:30, frac:1},
    {ch:'Offline', days:15, frac:1},{ch:'Corporate', days:0, frac:1},{ch:'Others', days:30, frac:1},
  ];
  const totalSec = sum(DATA.skus.map(s=>sum(skuRev(s.name, sc)))) || 1;
  const scale = INV[SCENARIOS[sc].invKey].net_rev / totalSec;
  const perSku = {};
  DATA.skus.forEach(s=>{ perSku[s.name] = new Array(12).fill(0); });
  DATA.skus.forEach(s=>{
    chMix.forEach(({ch,days,frac})=>{
      const sec = scArr(ch, s.name, 'units', sc).map(v=>v*scale);  // scale units same way
      const pNext = days/30, pCur = 1-pNext;
      for (let m=0;m<12;m++){
        const cur = sec[m] || 0;
        const nxt = m<11 ? sec[m+1] : sec[11];
        perSku[s.name][m] += (pCur*cur + pNext*nxt) * frac;
      }
    });
  });
  return perSku;
}

function wcBuildSKU(sku, sc, demandPerSku){
  const wc = WC_SKU[sku]; if (!wc) return null;
  const demand = demandPerSku[sku];
  const opening=new Array(12).fill(0), offtake=new Array(12).fill(0), arrivals=new Array(12).fill(0),
        placements=new Array(12).fill(0), closing=new Array(12).fill(0), stockout=new Array(12).fill(0),
        doc=new Array(12).fill(0); const orderEvents=[];
  WC_CONFIRMED.forEach(co=>{
    if (co.sku!==sku) return;
    if (co.arrivals) co.arrivals.forEach(a=>arrivals[a.monthIdx]+=a.qty);
    if (co.orderMonthIdx!=null && co.orderMonthIdx>=0){
      placements[co.orderMonthIdx] += (co.qty||0);
      orderEvents.push({placeIdx:co.orderMonthIdx, arriveIdx:co.arrivals[0].monthIdx, qty:co.qty, type:co.type||(wc.mii?'MII':'SKD'), confirmed:true});
    } else if (co.arrivals){
      co.arrivals.forEach(a=>orderEvents.push({placeIdx:-1, arriveIdx:a.monthIdx, qty:a.qty, type:co.sku==='BFF'?'BFF-SPECIAL':(wc.mii?'MII':'SKD'), confirmed:true}));
    }
  });
  const leadM = Math.max(0, Math.ceil(((wc.leadChina||0)+(wc.mii?(wc.leadMii||0):0))/30));
  for (let m=0;m<12;m++){
    const open = m===0 ? wc.opening : closing[m-1];
    opening[m]=open;
    const avail = open + arrivals[m];
    const taken = Math.min(demand[m], avail);
    offtake[m]=taken; stockout[m]=Math.max(0, demand[m]-taken);
    closing[m] = avail-taken; doc[m] = demand[m]>0 ? closing[m]/demand[m]*30 : 999;
    if (!wc.discontinued){
      const arriveAt = m+leadM;
      if (arriveAt<12){
        let proj = closing[m];
        for (let k=m+1;k<=arriveAt;k++) proj += (arrivals[k]||0)-(demand[k]||0);
        const avgFut = (demand[arriveAt] || demand[Math.min(11,arriveAt)] || demand[m]);
        const minReq = (WC_DOC_TARGET/30)*avgFut;
        if (proj<minReq){
          const deficit = minReq-proj;
          const units = Math.max(wc.moq, Math.ceil(deficit/wc.moq)*wc.moq);
          arrivals[arriveAt]+=units; placements[m]+=units;
          orderEvents.push({placeIdx:m, arriveIdx:arriveAt, qty:units, type:wc.mii?'MII':'SKD'});
        }
      }
    }
  }
  return {demand, opening, offtake, arrivals, placements, closing, stockout, doc, orderEvents, wc};
}

function wcBuildAll(sc){
  const inv = INV[SCENARIOS[sc].invKey];
  const {grossPrimary, commission, netPrimary} = wcPrimaryRevByMonth(sc);
  const demandPerSku = wcPrimaryUnitsByMonth(sc);

  const perSku = {};
  Object.keys(WC_SKU).forEach(n=>{ perSku[n] = wcBuildSKU(n, sc, demandPerSku); });

  // Inventory closing value (using NLC)
  const invCr = new Array(12).fill(0);
  Object.keys(perSku).forEach(n=>{
    const d = perSku[n]; if (!d) return;
    const uc = d.wc.nlcChina + d.wc.nlcIndia;
    for (let m=0;m<12;m++) invCr[m] += d.closing[m]*uc/1e7;
  });

  // P&L from investor scenario percentages on netPrimary (revenue net of commissions)
  // Using gm/ops/perf% of GROSS (i.e., grossPrimary or netPrimary). Investor uses Net Sec Revenue.
  // We treat netPrimary as the equivalent Net Revenue for P&L building.
  const baseRev = grossPrimary;  // P&L applied on Net Sec Revenue (= scaled gross primary)
  const cogsM   = baseRev.map(v=>v*(1-inv.gm_pct));
  const gmM     = baseRev.map(v=>v*inv.gm_pct);
  const opsM    = baseRev.map(v=>v*inv.ops_pct);
  const cm1M    = baseRev.map(v=>v*inv.cm1_pct);
  const perfM   = baseRev.map(v=>v*inv.perf_mkt_pct);
  const cm2M    = baseRev.map(v=>v*inv.cm2_pct);
  const brandM  = new Array(12).fill(inv.branding_cr/12);
  const salaryM = new Array(12).fill(inv.salary_cr/12);
  const ovhM    = new Array(12).fill(inv.overheads_cr/12);
  const incomeM = new Array(12).fill(inv.income_cr/12);
  const fixedCash = brandM.map((v,i)=>v+salaryM[i]+ovhM[i] - incomeM[i]);
  const ebitdaM = baseRev.map((v,i)=>cm2M[i] - brandM[i] - salaryM[i] - ovhM[i] + incomeM[i]);

  // Receivables: channel-weighted on gross primary
  const recCr = new Array(12).fill(0);
  const ampB = WC_AMZ_B2B;
  const chRec = [
    {ch:'Amazon', days:25, frac:ampB},{ch:'Amazon', days:7, frac:1-ampB},
    {ch:'Web', days:7, frac:1},{ch:'Blinkit', days:60, frac:1},{ch:'Flipkart', days:7, frac:1},
    {ch:'Swiggy', days:60, frac:1},{ch:'Offline', days:30, frac:1},{ch:'Corporate', days:7, frac:1},{ch:'Others', days:30, frac:1},
  ];
  const totalSec = sum(DATA.skus.map(s=>sum(skuRev(s.name, sc)))) || 1;
  const scale = inv.net_rev / totalSec;
  DATA.skus.forEach(n=>{
    chRec.forEach(({ch,days,frac})=>{
      const r = scArr(ch, n.name, 'revenue', sc).map(v=>v*scale);
      for (let i=0;i<12;i++) recCr[i] += r[i] * frac * days/30;
    });
  });

  // Vendor outflows
  const oChinaAdv=new Array(12).fill(0), oChinaDel=new Array(12).fill(0), oChinaPost=new Array(12).fill(0), oIndia=new Array(12).fill(0);
  Object.keys(perSku).forEach(n=>{
    const d = perSku[n]; if (!d) return;
    const cn = d.wc.nlcChina, ci = d.wc.nlcIndia;
    d.orderEvents.forEach(ev=>{
      if (ev.type==='BFF-SPECIAL'){ oChinaPost[0] += ev.qty*cn*0.70/1e7; return; }
      const chinaCr = ev.qty*cn/1e7, indiaCr = ev.qty*ci/1e7;
      const place = ev.placeIdx, arr = ev.arriveIdx;
      const delIdx = Math.max(0, arr-1), postIdx = Math.min(11, arr+2), miiIdx = Math.min(11, arr+1);
      if (chinaCr>0){
        if (place>=0 && place<12) oChinaAdv[place] += chinaCr*0.16;
        else if (arr-3>=0 && arr-3<12) oChinaAdv[Math.max(0,arr-3)] += chinaCr*0.16;
        if (delIdx<12) oChinaDel[delIdx] += chinaCr*0.20;
        if (postIdx<12) oChinaPost[postIdx] += chinaCr*0.64;
      }
      if (indiaCr>0 && miiIdx<12) oIndia[miiIdx] += indiaCr;
    });
  });
  const oAll = oChinaAdv.map((_,i)=>oChinaAdv[i]+oChinaDel[i]+oChinaPost[i]+oIndia[i]);

  // Cash flow
  const dArr = arr => arr.map((v,i)=> i===0 ? 0 : v-arr[i-1]);
  const dRec = dArr(recCr);
  const debt = [0.46,0.46,0.46,1.28,1.27,0.98,0.97,0.96,0.95,0.94,0.93,0.92];
  const mold = [2.30,0.22,0.40,0.11,0.25,0.25,0.25,0.25,0.25,0.25,0.25,0.25];
  const eqty = new Array(12).fill(0); eqty[3] = 100;  // July 2026 = idx 3
  const loan = new Array(12).fill(0); loan[0]=7;
  const opening_cash = 7.8;
  const variableSelling = perfM.map((v,i)=>v + opsM[i]);
  let cash = opening_cash;
  const cashOpen=new Array(12).fill(0), cashClose=new Array(12).fill(0), opCF=new Array(12).fill(0);
  const revCollected = netPrimary.map((v,i)=>v - dRec[i]);
  for (let m=0;m<12;m++){
    cashOpen[m] = cash;
    opCF[m] = revCollected[m] - oAll[m] - variableSelling[m] - fixedCash[m];
    cash = cashOpen[m] + opCF[m] - debt[m] - mold[m] + eqty[m] + loan[m];
    cashClose[m] = cash;
  }

  return {perSku, invCr, grossPrimary, commission, netPrimary, baseRev, recCr, dRec,
    oChinaAdv, oChinaDel, oChinaPost, oIndia, oAll,
    cogsM, gmM, opsM, cm1M, perfM, cm2M, brandM, salaryM, ovhM, incomeM, fixedCash, variableSelling,
    revCollected, opCF, cashOpen, cashClose, ebitdaM, debt, mold, eqty, loan};
}

function monthHdr(){ return MONTHS.map(mm=>`<th style="text-align:right">${mm}</th>`).join('') + '<th style="text-align:right">FY27</th>'; }
function nr(arr){ return arr.map(v=>`<td style="text-align:right">${fmtCr(v,1)}</td>`).join('') + `<td style="text-align:right;font-weight:600">${fmtCr(sum(arr),1)}</td>`; }
function nrClose(arr){ return arr.map(v=>`<td style="text-align:right">${fmtCr(v,1)}</td>`).join('') + `<td style="text-align:right;font-weight:600">${fmtCr(arr[arr.length-1],1)}</td>`; }
function neg(arr){ return arr.map(v=>`<td style="text-align:right">${fmtCr(-v,1)}</td>`).join('') + `<td style="text-align:right;font-weight:600">${fmtCr(-sum(arr),1)}</td>`; }
function grpBar(l){ return `<tr style="background:#1F2937;color:#FFF"><td colspan="14" style="font-weight:700;padding:8px 10px;font-size:11px;text-transform:uppercase;text-align:left">${l}</td></tr>`; }
function boldR(l, arr, color, bg, bord){
  const cells = arr.map(v=>`<td style="text-align:right;font-weight:700;color:${color}">${fmtCr(v,1)}</td>`).join('');
  const totVal = (arr === window._cashCloseRef) ? arr[11] : sum(arr);
  return `<tr style="background:${bg};border-top:2px solid ${bord};border-bottom:2px solid ${bord}"><td style="font-weight:700;color:${color};text-align:left">${l}</td>${cells}<td style="text-align:right;font-weight:700;color:${color}">${fmtCr(totVal,1)}</td></tr>`;
}

  h += `<tr style="background:var(--surface2);font-weight:600"><td style="text-align:left">China subtotal</td>${nr(chinaTot)}</tr>`;
  h += grpBar('India (MII) leg');
  h += `<tr><td style="text-align:left">  India T+30 (100% India leg)</td>${nr(m.oIndia)}</tr>`;
  h += `<tr style="background:#D1FAE5;font-weight:700;color:#065F46"><td style="text-align:left">Total vendor outflow</td>${nr(m.oAll)}</tr>`;
  h += '</tbody></table></div></div>';
  return h;
}

function renderWCInventory(m, sc){
  let h = '<div class="card"><div class="card-title">Inventory by SKU — closing units (DoC in brackets)</div><div class="tbl-wrap"><table>';
  h += `<thead><tr><th class="frozen-col-h">SKU</th>${MONTHS.map(mm=>`<th>${mm}</th>`).join('')}<th>Stockout</th></tr></thead><tbody>`;
  Object.keys(WC_SKU).forEach(n=>{
    const d = m.perSku[n]; if (!d) return;
    const cells = d.closing.map((v,i)=>{
      const doc = d.doc[i];
      let col = '';
      if (doc < WC_DOC_TARGET) col = 'color:var(--neg)';
      else if (doc > WC_DOC_TARGET*1.75) col = 'color:var(--pos)';
      return `<td style="${col}">${fmtInt(v)} <span class="small muted">(${doc>999?'∞':Math.round(doc)}d)</span></td>`;
    }).join('');
    const so = sum(d.stockout);
    h += `<tr><td class="frozen-col lh">${n}${d.wc.discontinued?' <span class="badge">discont.</span>':''}</td>${cells}<td style="${so>0?'color:var(--neg)':''}">${fmtInt(so)}</td></tr>`;
  });
  h += `<tr style="background:var(--surface2);font-weight:600"><td class="frozen-col lh" style="background:var(--surface2)">Inventory value (₹ Cr)</td>${m.invCr.map(v=>`<td>${fmtCr(v,1)}</td>`).join('')}<td>${fmtCr(m.invCr[11],1)}</td></tr>`;
  h += '</tbody></table></div></div>';
  return h;
}

function renderWCReceivables(m, sc){
  const ampB = WC_AMZ_B2B;
  const totalSec = sum(DATA.skus.map(s=>sum(skuRev(s.name, sc)))) || 1;
  const scale = INV[SCENARIOS[sc].invKey].net_rev / totalSec;
  const chList = [
    ['Amazon B2B',25,'Amazon',ampB],['Amazon B2C',7,'Amazon',1-ampB],
    ['Web',7,'Web',1],['Blinkit',60,'Blinkit',1],['Flipkart',7,'Flipkart',1],
    ['Swiggy',60,'Swiggy',1],['Offline',30,'Offline',1],['Corporate',7,'Corporate',1],['Others',30,'Others',1],
  ];
  let h = '<div class="card"><div class="card-title">Receivables — channel-weighted (₹ Cr)</div><div class="tbl-wrap"><table>';
  h += `<thead><tr><th class="frozen-col-h">Channel (rec. days)</th>${monthHdr()}</tr></thead><tbody>`;
  chList.forEach(([lbl, days, ch, frac])=>{
    const bal = new Array(12).fill(0);
    DATA.skus.forEach(s=>{
      const r = scArr(ch, s.name, 'revenue', sc).map(v=>v*scale);
      for (let i=0;i<12;i++) bal[i] += r[i] * frac * days/30;
    });
    h += `<tr><td class="frozen-col lh">${lbl} <span class="small muted">(${days}d)</span></td>${nrClose(bal)}</tr>`;
  });
  h += `<tr style="background:#D1FAE5;font-weight:700;color:#065F46"><td class="frozen-col lh" style="background:#D1FAE5">Total receivables (closing)</td>${nrClose(m.recCr)}</tr>`;
  h += `<tr><td class="frozen-col lh">Δ Receivables (cash drag)</td>${neg(m.dRec)}</tr>`;
  h += '</tbody></table></div></div>';
  return h;
}

renderTabs();
